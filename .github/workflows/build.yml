on:
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag or SHA to build. Empty = the caller's ref."
        required: false
        type: string
        default: ""
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: git-dyn-semver derives the version from git state, so a
      # shallow clone would build the wrong number rather than fail.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}
      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Build
        run: ./gradlew clean build
