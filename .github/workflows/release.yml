name: Release

# Dispatch from main with dry-run on to preview the version and notes; run again
# with it off to release. Everything before the `publish` job is reversible: a
# tag can be deleted, and the release starts as a prerelease, which
# /releases/latest excludes. `publish` is bound to the `stable` environment, so
# it waits for a required reviewer; promotion to latest runs only after it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (no v prefix), e.g. 1.1.0. Leave empty to auto-detect from Conventional Commits."
        required: false
        type: string
      prerelease:
        description: "Publish as a release candidate: verified like any release, but never promoted to latest. The number is chosen for you (1.1.0 -> 1.1.0-rc1, then the next)."
        required: false
        type: choice
        options: [none, rc, b, a]
        default: none
      ref:
        description: "Branch to release from. Leave empty for the branch this workflow was dispatched on."
        required: false
        type: string
      force:
        description: "Allow a version that disagrees with the auto-detected one."
        required: false
        type: boolean
        default: false
      dry-run:
        description: "Validate and preview only -- nothing tagged, nothing published."
        required: false
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: resolve version and notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      auto: ${{ steps.resolve.outputs.auto }}
      previous: ${{ steps.previous.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      # The dispatched commit, to get the local actions. The requested ref is
      # validated with them before it is checked out.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/check-release-branch
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/check-version
        with:
          version: ${{ inputs.version }}
          version-format: semver

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/setup-git-cliff

      # Captured before anything creates the new tag.
      - name: Record previous tag
        id: previous
        run: |
          PREV="$(git tag --list --sort=-version:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/resolve-version
        id: resolve
        with:
          version: ${{ inputs.version }}
          version-format: semver
          prerelease: ${{ inputs.prerelease }}
          force: ${{ inputs.force }}
          cliff-config: cliff.toml

      - uses: ./.github/actions/check-version
        with:
          version: ${{ steps.resolve.outputs.version }}
          version-format: semver

      - name: Check tag does not already exist
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          if git rev-parse "$VERSION" > /dev/null 2>&1; then
            echo "::error::Tag '$VERSION' already exists"
            exit 1
          fi

      - name: Generate changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git-cliff --config cliff.toml --latest --unreleased --strip all --output NOTES.md

      # Handed downstream rather than regenerated at tag time: the notes that
      # were previewed are the notes that ship.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-notes
          path: NOTES.md

      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          AUTO: ${{ steps.resolve.outputs.auto }}
          SOURCE: ${{ steps.resolve.outputs.source }}
          REF: ${{ inputs.ref || github.ref }}
          DRY_RUN: ${{ inputs.dry-run }}
          LATEST: ${{ steps.previous.outputs.tag }}
          PRERELEASE: ${{ steps.resolve.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            FINISH="tag + prerelease + publish, then STOP -- not promoted to latest"
          else
            FINISH="tag + prerelease + publish + promote to latest"
          fi
          # Test the value: "false" is non-empty, so ${DRY_RUN:+...} would expand
          # for both.
          if [ "$DRY_RUN" = "true" ]; then
            HEADING="Release (dry run)"
            MODE="dry run -- nothing tagged, nothing published"
          else
            HEADING="Release"
            MODE="awaiting approval, then $FINISH"
          fi
          {
            echo "### $HEADING"
            echo ""
            echo "| | Value |"
            echo "|---|---|"
            echo "| Version | \`$VERSION\` |"
            echo "| Auto-detected | \`$AUTO\` |"
            echo "| Source | $SOURCE |"
            echo "| Ref | \`$REF\` |"
            echo "| Previous tag | \`${LATEST:-(none yet)}\` |"
            echo "| Mode | $MODE |"
            echo ""
            echo "#### Release notes"
            echo ""
            cat NOTES.md 2>/dev/null || echo "_(not generated -- an earlier step failed)_"
            echo ""
            # Anything here but missing above was dropped as unconventional or as
            # a skipped ci:/build: type.
            echo "<details><summary>Commits since \`${LATEST:-the beginning}\`</summary>"
            echo ""
            if [ -n "$LATEST" ]; then
              git log "${LATEST}..HEAD" --format="- %h %s"
            else
              git log --format="- %h %s" | head -40
            fi
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  # The same checks that guard main, run before anything is tagged.
  checks:
    needs: prepare
    if: ${{ !inputs.dry-run }}
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref }}
    permissions:
      contents: read

  tag:
    name: tag and create the prerelease
    needs: [prepare, checks]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/check-release-branch
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/check-version
        with:
          version: ${{ needs.prepare.outputs.version }}
          version-format: semver

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-notes

      - name: Create and push the tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if git rev-parse "$VERSION" > /dev/null 2>&1; then
            echo "::error::Tag '$VERSION' already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          # persist-credentials: false leaves `origin` without auth; push to an
          # explicit tokenised URL rather than storing one in .git/config.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$VERSION"

      # Every release starts as a prerelease, so nothing polling /releases/latest
      # sees it until `promote`.
      - name: Create the prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$VERSION" --title "$VERSION" --notes-file NOTES.md --prerelease

  # THE APPROVAL GATE -- bound to the `stable` environment, so it waits for a
  # required reviewer. Publishing is the first step that cannot be undone.
  publish:
    name: publish to the Gradle Plugin Portal
    needs: [prepare, tag]
    runs-on: ubuntu-latest
    environment: stable
    permissions:
      contents: read
    steps:
      # Full history and tags: git-dyn-semver derives the version from git state,
      # and a shallow clone would publish the wrong number rather than fail.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.prepare.outputs.version }}

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          java-version: "25"
          distribution: temurin

      # Stops the build and the tag disagreeing before anything reaches the
      # portal.
      - name: Assert the resolved version
        env:
          EXPECTED: ${{ needs.prepare.outputs.version }}
        run: |
          RESOLVED=$(./gradlew printVersion -q | tail -1)
          echo "Resolved version: $RESOLVED"
          if [ "$RESOLVED" != "$EXPECTED" ]; then
            echo "::error::Project resolves to '$RESOLVED' but '$EXPECTED' was released -- refusing to publish."
            exit 1
          fi

      - name: Publish to the Gradle Plugin Portal
        run: ./gradlew publishPlugins
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

  # Last, deliberately: until this runs nothing resolving "the latest release"
  # can see what was built. Requires `publish` to have succeeded, so a failed or
  # skipped upstream job never promotes anything.
  promote:
    name: promote to latest
    needs: [prepare, publish]
    if: ${{ !inputs.dry-run && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote the prerelease
        if: ${{ needs.prepare.outputs.prerelease != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          gh release edit "$VERSION" --repo "$REPO" --prerelease=false --latest
          echo "### Released: \`$VERSION\` is now the latest release." >> "$GITHUB_STEP_SUMMARY"

      - name: Leave it as a prerelease
        if: ${{ needs.prepare.outputs.prerelease == 'true' }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "### Release candidate published: \`$VERSION\` stays a prerelease; run again with prerelease none to release." >> "$GITHUB_STEP_SUMMARY"
